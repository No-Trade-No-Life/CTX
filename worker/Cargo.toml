[package]
name = "docs-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8.7", features = ["d1"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde", "js"] }
sha2 = "0.10"
base64 = "0.22"
fractional_index = "2"
chrono = { version = "0.4", default-features = false, features = ["wasmbind", "clock"] }
thiserror = "2"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
codegen-units = 1
panic = "abort"
