<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/docs-mark.svg" />
    <meta name="description" content="Docs is an AI-native Markdown publishing tool." />
    <script>
      // Linkit owns the dark mode preference (see linkit-react-components);
      // apply the mirrored preference before the first paint.
      (function () {
        try {
          var choice = localStorage.getItem("linkit.theme");
          var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
    <title>Docs — Markdown publishing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
