[package]
name = "ctx"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AI-native Markdown Context CMS"
repository = "https://github.com/No-Trade-No-Life/CTX"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
auth-mini-axum = "0.1.2"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["trace"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -2 }
suspicious = { level = "warn", priority = -2 }
style = { level = "warn", priority = -2 }
complexity = { level = "warn", priority = -2 }
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
semicolon_if_nothing_returned = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
